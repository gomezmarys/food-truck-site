<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

      <a href="menu" class="btn btn-dark btn-lg">View Menu</a>

    <main class="container py-5">
      <section id="menu">
        <h2 class="mb-4">Menu</h2>
        <div class="row g-4">
          <!-- Card 1 (Day 1) -->
          <div class="col-md-4">
            <div class="card h-100">
              <div class="card-body">
                <h3 class="card-title">Food Item 1</h3>
                <p class="card-text">Description of Food Item 1.</p>
                <p class="fw-bold text-success mb-0">$12.99</p>
              </div>
            </div>
          </div>

          <!-- Card 2 (Day 1) -->
          <div class="col-md-4">
            <div class="card h-100">
              <div class="card-body">
                <h3 class="card-title">Food Item 2</h3>
                <p class="card-text">Description of Food Item 2.</p>
                <p class="fw-bold text-success mb-0">$15.99</p>
              </div>
            </div>
          </div>
          <!-- Card 3 (Day 1) -->
          <div class="col-md-4">
            <div class="card h-100">
              <div class="card-body">
                <h3 class="card-title">Food Item 3</h3>
                <p class="card-text">Description of Food Item 3.</p>
                <p class="fw-bold text-success mb-0">$18.99</p>
              </div>
            </div>
          </div>
        </div>
